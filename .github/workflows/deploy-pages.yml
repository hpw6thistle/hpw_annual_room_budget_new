name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and package static site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -f .nojekyll
          test -d assets
          for file in assets/*.js; do
            node --check "$file"
          done
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets _site/
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          root = Path('_site').resolve()
          class CheckAssets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  key = 'src' if tag == 'script' else 'href' if tag == 'link' else None
                  if key and key in attrs:
                      url = urlsplit(attrs[key])
                      assert not url.scheme and not url.netloc, f'External asset: {attrs[key]}'
                      assert not url.path.startswith('/'), f'Asset must use a relative URL: {attrs[key]}'
                      path = (root / unquote(url.path)).resolve()
                      assert path.is_relative_to(root) and path.is_file(), f'Missing asset: {attrs[key]}'
          CheckAssets().feed((root / 'index.html').read_text())
          print('Static site validation passed')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
